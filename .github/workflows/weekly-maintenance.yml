name: Weekly website maintenance

on:
  schedule:
    - cron: "17 8 * * 1"
      timezone: "America/Jamaica"
  workflow_dispatch:

concurrency:
  group: weekly-website-maintenance
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Check out the website
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run deterministic website checks
        run: ./scripts/weekly-maintenance.sh

      - name: Review with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/weekly-maintenance.md
          sandbox: read-only
          codex-args: '["--ephemeral"]'

  report:
    needs: audit
    if: ${{ needs.audit.outputs.report != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Create weekly maintenance issue
        uses: actions/github-script@v7
        env:
          CODEX_REPORT: ${{ needs.audit.outputs.report }}
        with:
          github-token: ${{ github.token }}
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              process.env.CODEX_REPORT,
              "",
              "---",
              `Generated by the [weekly maintenance workflow](${runUrl}).`,
              "Review and approve any changes manually; this workflow does not modify the website."
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly website maintenance — ${date}`,
              body
            });
